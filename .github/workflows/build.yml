name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: bash ./gradlew assembleDebug test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-bypass-debug
          path: app/build/outputs/apk/debug/app-debug.apk
