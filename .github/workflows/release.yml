name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/notbypass-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/notbypass-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: bash ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify and hash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/NOTBYPASS-${GITHUB_REF_NAME}.apk.sha256"
          cp "$APK" "$RUNNER_TEMP/NOTBYPASS-${GITHUB_REF_NAME}.apk"

      - name: Source archive
        run: |
          git archive --format=zip --prefix=not-bypass/ -o "$RUNNER_TEMP/NOTBYPASS-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/NOTBYPASS-${{ github.ref_name }}.apk
            ${{ runner.temp }}/NOTBYPASS-${{ github.ref_name }}.apk.sha256
            ${{ runner.temp }}/NOTBYPASS-${{ github.ref_name }}-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wipe keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/notbypass-release.jks"
